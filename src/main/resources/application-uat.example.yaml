spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wms
    username: <username>
    password: <password>
    hikari:
      data-source-properties:
        # MySQL driver: turn a JDBC batch into 1 multi-row INSERT (batch_size in application.yaml).
        # Without it the driver still sends every statement of the batch one by one
        rewriteBatchedStatements: true

  # Dev only: recreates the schema and reloads data.sql on every startup
  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Dev only: logs "N JDBC statements executed" once per session (open-in-view is off: once per transaction)
        generate_statistics: true
    hibernate:
      ddl-auto: create

logging:
  level:
    # Dev only: prints the "Session Metrics { ... N JDBC statements }" block enabled by generate_statistics
    # (Hibernate 7 logger name; the old org.hibernate.engine.internal.StatisticalLoggingSessionEventListener no longer logs)
    org.hibernate.session.metrics: debug

jwt:
  # Base64 of at least 32 random bytes. Generate with: openssl rand -base64 64
  secret: <base64-secret>
